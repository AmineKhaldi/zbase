name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DEPS_DIR: ${{ github.workspace }}/dist/macos-deps
    steps:
      - uses: actions/checkout@v7
      - name: Validate release version and platform
        id: version
        env:
          RELEASE_BUILD: ${{ github.event_name == 'release' }}
        run: |
          test "$(uname -m)" = arm64
          VERSION=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          if [[ "$RELEASE_BUILD" == true ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v${VERSION}" ]]; then
              echo 'Release tag must match the package version in Cargo.toml' >&2
              exit 1
            fi
            if ! jq -e '.release.immutable != true' "$GITHUB_EVENT_PATH"; then
              echo 'This workflow attaches assets after publication; immutable releases must be disabled' >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install build tools
        run: |
          brew install cmake pkgconf meson ninja
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            dist/macos-deps/prefix
            dist/macos-deps/downloads
          key: media-macos15-arm64-${{ hashFiles('scripts/macos/build_media_deps.sh') }}
      - name: Build pinned media libraries
        run: |
          scripts/macos/build_media_deps.sh
          echo "PKG_CONFIG_PATH=$DEPS_DIR/prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$DEPS_DIR/prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-macos15-arm64-${{ hashFiles('Cargo.lock', 'scripts/macos/build_media_deps.sh') }}-${{ github.sha }}
          restore-keys: |
            rust-macos15-arm64-${{ hashFiles('Cargo.lock', 'scripts/macos/build_media_deps.sh') }}-
      - name: Test and build app
        run: |
          python3 -m unittest discover -s scripts/macos -p test_bundle_dylibs.py -v
          cargo test --locked --all-targets --features gpui/runtime_shaders
          scripts/macos/build_app_bundle.sh release
          python3 scripts/macos/bundle_dylibs.py dist/macos/zBase.app --prefix "$DEPS_DIR/prefix"
      - name: Import signing credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: scripts/macos/import_signing_identity.sh
      - name: Sign, notarize, and validate app and DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/macos/package_release.sh dist/macos/zBase.app "dist/release/zBase-${VERSION}-macos-arm64.dmg"
      - name: Include corresponding media sources and build information
        run: |
          cp "$DEPS_DIR"/downloads/*.tar.* dist/release/
          cp -R dist/macos/zBase.app/Contents/Resources/Licenses/Media dist/release/media-build-info
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: dist/release/
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/zbase-signing/release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/zbase-signing"

  attach:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE_ID: ${{ github.event.release.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: dist/release
      - name: Attach verified assets to the published release
        run: |
          TAG="v${VERSION}"
          # Check the original release still exists and accepts asset uploads.
          gh api "repos/$GH_REPO/releases/tags/$TAG" > release-state.json
          jq -e --argjson id "$RELEASE_ID" \
            '.id == $id and .draft == false and .immutable != true' release-state.json
          tar -czf dist/release/media-build-info.tar.gz -C dist/release media-build-info
          gh release upload "$TAG" dist/release/*.dmg dist/release/*.sha256 dist/release/*.tar.* --clobber
      - name: Update Homebrew source formula
        if: github.event.release.prerelease == false
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: python3 scripts/update_homebrew.py "v${VERSION}"
