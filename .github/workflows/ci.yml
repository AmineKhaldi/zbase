name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Workflow and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows and scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: |
          "$(go env GOPATH)/bin/actionlint"
          git ls-files -z '*.sh' | xargs -0 shellcheck
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

  macos:
    name: macOS build, tests, and bundle verification
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      DEPS_DIR: ${{ github.workspace }}/dist/macos-deps
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          brew install cmake pkgconf meson ninja
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            dist/macos-deps/prefix
            dist/macos-deps/downloads
          key: media-macos15-arm64-${{ hashFiles('scripts/macos/build_media_deps.sh') }}
      - name: Build pinned media libraries
        run: |
          scripts/macos/build_media_deps.sh
          echo "PKG_CONFIG_PATH=$DEPS_DIR/prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$DEPS_DIR/prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-rust-macos15-arm64-${{ hashFiles('Cargo.lock', 'scripts/macos/build_media_deps.sh') }}-${{ github.sha }}
          restore-keys: |
            ci-rust-macos15-arm64-${{ hashFiles('Cargo.lock', 'scripts/macos/build_media_deps.sh') }}-
      - name: Clippy
        run: cargo clippy --locked --all-targets --features gpui/runtime_shaders
      - name: Rust tests
        run: cargo test --locked --all-targets --features gpui/runtime_shaders
      - name: Packaging integration tests
        run: python3 -m unittest discover -s scripts/macos -p test_bundle_dylibs.py -v
      - name: Build and verify self-contained app
        run: |
          scripts/macos/build_app_bundle.sh release
          python3 scripts/macos/bundle_dylibs.py dist/macos/zBase.app --prefix "$DEPS_DIR/prefix"
          plutil -lint dist/macos/zBase.app/Contents/Info.plist
          for library in dist/macos/zBase.app/Contents/Frameworks/*.dylib; do
            codesign --force --sign - "$library"
          done
          codesign --force --sign - dist/macos/zBase.app
          codesign --verify --deep --strict --verbose=2 dist/macos/zBase.app
      - name: Archive development app
        run: ditto -c -k --sequesterRsrc --keepParent dist/macos/zBase.app dist/macos/zBase-development.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos-development-app
          path: dist/macos/zBase-development.zip
          if-no-files-found: error
          retention-days: 7
